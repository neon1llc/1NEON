# .github/workflows/deploy.yml - One release per commit on main: every gate passes first, then a single locked job applies Terraform and ships the API and web app from the artifact the gates built.
# Nothing touches AWS until the secret scan, app checks, walkthrough check, Terraform checks, and production build have all passed on this
# commit. Off until AWS_DEPLOY_ROLE_ARN is set; Terraform also needs AWS_TERRAFORM_ROLE_ARN or an explicit skip
# (see infra/README.md).

name: deploy

# Pushes to main that touch app code or infrastructure, or a manual run. Terraform plans on every release
# and applies only when the plan has changes, so no path filtering decides what converges
on:
  push:
    branches: [main]
    # Root package.json and the shared tsconfig change the build too
    paths: ["apps/**", "packages/**", "package.json", "package-lock.json", "tsconfig.base.json", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
    inputs:
      # Skipping production Terraform is a choice made here (or with the SKIP_PRODUCTION_TERRAFORM
      # repository variable), never the side effect of a variable nobody set
      skip_terraform:
        description: "Ship the app without planning or applying production Terraform"
        type: boolean
        default: false

# Read-only by default; the release job adds the OIDC token it needs
permissions:
  contents: read

# Where the app ships: the app bucket, the neon1.tech distribution, and the function name prefix
env:
  APP_BUCKET: neon1-1neon-app-prod
  DISTRIBUTION_ID: EKL1R4AOR1VRG
  FUNCTION_PREFIX: 1neon-prod

jobs:
  # ---- Gates: none of these touch AWS, so any can fail with production unchanged ----

  # Full history, so a secret in any commit stops the release. The image is pinned by digest
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .

  # App typecheck, tests, and the production build; then the Terraform checks. The build output is
  # uploaded, and the release job ships that artifact rather than rebuilding it
  gate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, matching the Lambda runtime, with the npm cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Exact lockfile install, then typecheck, tests (including the API and domain contract tests),
      # and the production builds, which stamp the API with this commit
      - run: npm ci
      - run: npm run check

      # The same Terraform checks as CI, with no AWS access
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate -no-color
      # Runs plan-time tests wherever the stack has them; none today
      - name: Terraform tests
        run: |
          if [ -n "$(find infra -name '*.tftest.hcl' -print -quit)" ]; then
            terraform -chdir=infra/envs/prod test -no-color
          else
            echo "no Terraform test files"
          fi

      # A CycloneDX inventory of what ships (production dependencies only), kept with the run
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      # Stage what ships, with the identity the release job checks: this commit and this lockfile
      - name: Stage the release
        run: |
          mkdir release
          cp -r apps/api/dist release/api
          cp -r apps/web/dist release/web
          printf '{"commit":"%s","lock":"sha256:%s"}\n' "$GITHUB_SHA" "$(sha256sum package-lock.json | cut -d' ' -f1)" > release/identity.json
          cat release/identity.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  # Every guided walkthrough, played in a real browser on a desktop and a phone screen, has to reach
  # its end card before anything ships
  walkthroughs:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The web build, then Chromium for the Playwright version in the lockfile
      - run: npm ci
      - run: npm run build --workspace @1neon/web
      - run: npx playwright install --with-deps chromium
      - run: npm run walkthroughs

      # A failed run leaves a screenshot of where it stopped
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: walkthrough-failures
          path: walkthrough-failure-*.png
          if-no-files-found: ignore
          retention-days: 14

  # ---- Release: one job, so one lock covers Terraform and the app together ----

  # Runs only after every gate passed on this same commit. The release group is shared by every run
  # and a running release is never cancelled, so infrastructure A, infrastructure B, app A cannot
  # happen. (GitHub keeps one waiting run per group; a newer push replaces it, which is fine because
  # the newest main commit contains the older one.) Skipped until the deploy role exists; id-token
  # lets the job assume the roles
  release:
    needs: [secrets, gate, walkthroughs]
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      # write only to push the release tag once the release is verified live
      contents: write
      id-token: write

    concurrency:
      group: release-prod
      cancel-in-progress: false

    env:
      # "true" only by an explicit choice: the dispatch input, or the repository variable
      SKIP_TERRAFORM: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip_terraform) || vars.SKIP_PRODUCTION_TERRAFORM == 'true' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Production Terraform is either run or explicitly skipped, never silently dropped
      - name: Check the Terraform switch
        env:
          TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [ "$SKIP_TERRAFORM" = "true" ]; then
            echo "::warning::production Terraform is explicitly skipped for this release"
            echo "terraform skipped by choice" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$TERRAFORM_ROLE_ARN" ]; then
            echo "::error::AWS_TERRAFORM_ROLE_ARN is not set. Set it, or skip Terraform on purpose (skip_terraform input or SKIP_PRODUCTION_TERRAFORM=true)"
            exit 1
          fi

      # A release that waited in the queue must not roll production back behind a newer commit:
      # if main has moved on, this one stops before any AWS call, and the newer run ships it all
      - name: Stop if main has moved on
        if: github.event_name == 'push'
        run: |
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error::could not read the head of main"; exit 1; }
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now ${head::7}; this release (${GITHUB_SHA::7}) is superseded"
            echo "superseded=yes" >> "$GITHUB_ENV"
          fi

      - if: env.superseded != 'yes'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: release

      # The artifact must have been built from this commit and this lockfile, not another run's
      - name: Check the artifact
        if: env.superseded != 'yes'
        run: |
          lock="sha256:$(sha256sum package-lock.json | cut -d' ' -f1)"
          want="{\"commit\":\"$GITHUB_SHA\",\"lock\":\"$lock\"}"
          [ "$(cat release/identity.json)" = "$want" ] || { echo "::error::artifact identity is $(cat release/identity.json), expected $want"; exit 1; }
          echo "release ${GITHUB_SHA::7}, lockfile $lock" >> "$GITHUB_STEP_SUMMARY"

      # ---- Infrastructure first: the app never ships ahead of the stack it needs ----

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - if: env.superseded != 'yes' && env.SKIP_TERRAFORM != 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Short-lived credentials through GitHub OIDC; the role trusts only this repo's main branch
      - if: env.superseded != 'yes' && env.SKIP_TERRAFORM != 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Init against the S3 backend, then save the plan. Exit code 2 means the plan has changes
      - name: Plan
        id: plan
        if: env.superseded != 'yes' && env.SKIP_TERRAFORM != 'true'
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          [ "$code" = 1 ] && exit 1
          echo "changes=$([ "$code" = 2 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      # Apply exactly the plan above, only when it changes something
      - name: Apply
        if: env.superseded != 'yes' && env.SKIP_TERRAFORM != 'true' && steps.plan.outputs.changes == 'yes'
        working-directory: infra/envs/prod
        run: terraform apply -input=false -no-color tfplan
      # Release record: which commit the infrastructure now matches
      - name: Record infrastructure
        if: env.superseded != 'yes' && env.SKIP_TERRAFORM != 'true'
        run: |
          echo "infrastructure at ${GITHUB_SHA::7}, changes applied: ${{ steps.plan.outputs.changes }}" >> "$GITHUB_STEP_SUMMARY"

      # ---- Then the app, from the artifact the gates built ----

      # Switch to the deploy role (a second assumption replaces the Terraform one)
      - if: env.superseded != 'yes'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Refuse to ship into the wrong place: the caller must be the role's own account, and the
      # app bucket must exist there
      - name: Check the target
        if: env.superseded != 'yes'
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          expected=$(cut -d: -f5 <<<"$ROLE_ARN")
          actual=$(aws sts get-caller-identity --query Account --output text)
          [ "$expected" = "$actual" ] || { echo "::error::credentials are for another account"; exit 1; }
          aws s3api head-bucket --bucket "$APP_BUCKET" --expected-bucket-owner "$actual"

      # API first, so the new app never calls an old API. Source maps stay out of the zip
      - name: Ship Lambda functions
        if: env.superseded != 'yes'
        working-directory: release/api
        run: |
          for fn in api auth-triggers; do
            name="$FUNCTION_PREFIX-${fn/auth-triggers/auth-trigger}"
            (cd "$fn" && zip -q -r "../$fn.zip" . -x '*.map')
            aws lambda update-function-code --function-name "$name" --zip-file "fileb://$fn.zip" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$name"
            echo "shipped $name"
          done

      # Hashed assets cache for a year; the shell (index.html) and the unhashed arrive.js are always revalidated.
      # New assets go up first and old ones stay, so open tabs and a rollback still find their files;
      # the shell switches over only once everything it names is in place
      - name: Upload the web app
        if: env.superseded != 'yes'
        working-directory: release/web
        run: |
          aws s3 sync 1NEON "s3://$APP_BUCKET/1NEON" --exclude '*.map' --exclude index.html --exclude arrive.js \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp 1NEON/index.html "s3://$APP_BUCKET/1NEON/index.html" \
            --cache-control 'no-cache' --content-type 'text/html; charset=utf-8'
          aws s3 cp 1NEON/arrive.js "s3://$APP_BUCKET/1NEON/arrive.js" \
            --cache-control 'no-cache' --content-type 'text/javascript; charset=utf-8'

      # Drop cached app files so the new shell and assets show at once
      - name: Invalidate the CDN
        if: env.superseded != 'yes'
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/1NEON/*' >/dev/null

      # Through neon1.tech: the API reports this commit, and the shell plus every asset it names loads.
      # Each curl is checked on its own, so a cut-off transfer fails the step
      - name: Verify
        if: env.superseded != 'yes'
        run: |
          set -euo pipefail
          want="${GITHUB_SHA::7}"
          health=$(curl -fsS --retry 3 --retry-all-errors https://neon1.tech/1NEON/api/health)
          grep -q "\"version\":\"$want\"" <<<"$health" || { echo "::error::API reports $health, expected $want"; exit 1; }
          shell=$(curl -fsS --retry 3 --retry-all-errors -H 'cache-control: no-cache' https://neon1.tech/1NEON/)
          refs=$(grep -oE '/1NEON/(assets/[^"?]+|arrive\.js)' <<<"$shell" | sort -u)
          [ -n "$refs" ] || { echo "::error::the shell names no assets"; exit 1; }
          for ref in $refs; do
            curl -fsS -o /dev/null "https://neon1.tech$ref" || { echo "::error::$ref did not load"; exit 1; }
            echo "ok $ref"
          done

      # Old hashed assets are kept for 14 days for open tabs and rollback, then removed (none old is fine). Anything this
      # build still uses is never removed, however old
      - name: Prune old assets
        if: env.superseded != 'yes'
        working-directory: release/web
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "$APP_BUCKET" --prefix 1NEON/assets/ \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text | tr '\t' '\n' | { grep -v '^None$' || true; } | while read -r key; do
              [ -z "$key" ] && continue
              [ -e "${key}" ] && continue
              aws s3 rm "s3://$APP_BUCKET/$key"
            done

      # Release record: the commit the API reports and the app serves
      - if: env.superseded != 'yes'
        run: |
          echo "app at ${GITHUB_SHA::7}, verified through neon1.tech" >> "$GITHUB_STEP_SUMMARY"

      # Every released version gets an annotated tag on the commit that shipped it, once it's live.
      # The version is the changelog's top entry; a push that doesn't add one ships under the last tag
      - name: Tag the release
        if: env.superseded != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          [ -n "$version" ] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "v$version" "$GITHUB_SHA"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v$version"
            echo "tagged v$version" >> "$GITHUB_STEP_SUMMARY"
          fi
