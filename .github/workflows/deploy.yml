# .github/workflows/deploy.yml - Build and ship the app from main: API code, then the web app.
# Off until the repository variable AWS_DEPLOY_ROLE_ARN is set (see infra/README.md).

name: deploy

# Pushes to main that touch app code, or a manual run
on:
  push:
    branches: [main]
    # Root package.json and the shared tsconfig change the build too
    paths: ["apps/**", "packages/**", "package.json", "package-lock.json", "tsconfig.base.json", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Read-only by default; the job adds the OIDC token it needs
permissions:
  contents: read

# Where the app ships: the app bucket, the neon1.tech distribution, and the function name prefix
env:
  APP_BUCKET: neon1-1neon-app-prod
  DISTRIBUTION_ID: EKL1R4AOR1VRG
  FUNCTION_PREFIX: 1neon-prod

jobs:
  # Skipped until the deploy role exists; id-token lets the job assume it
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # Let a running deploy finish; the next one starts after it
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, matching the Lambda runtime, with the npm cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The same checks as CI; nothing ships that fails them
      - run: npm ci
      - run: npm run check

      # Short-lived credentials through GitHub OIDC; the role trusts only this repo's main branch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Refuse to ship into the wrong place: the caller must be the role's own account, and the
      # app bucket must exist there
      - name: Check the target
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          expected=$(cut -d: -f5 <<<"$ROLE_ARN")
          actual=$(aws sts get-caller-identity --query Account --output text)
          [ "$expected" = "$actual" ] || { echo "::error::credentials are for another account"; exit 1; }
          aws s3api head-bucket --bucket "$APP_BUCKET" --expected-bucket-owner "$actual"

      # API first, so the new app never calls an old API. Source maps stay out of the zip
      - name: Ship Lambda functions
        working-directory: apps/api/dist
        run: |
          for fn in api auth-triggers; do
            name="$FUNCTION_PREFIX-${fn/auth-triggers/auth-trigger}"
            (cd "$fn" && zip -q -r "../$fn.zip" . -x '*.map')
            aws lambda update-function-code --function-name "$name" --zip-file "fileb://$fn.zip" >/dev/null
            aws lambda wait function-updated-v2 --function-name "$name"
            echo "shipped $name"
          done

      # Hashed assets cache for a year; the shell (index.html) and the unhashed arrive.js are always revalidated.
      # New assets go up first and old ones stay, so open tabs and a rollback still find their files;
      # the shell switches over only once everything it names is in place
      - name: Upload the web app
        working-directory: apps/web/dist
        run: |
          aws s3 sync 1NEON "s3://$APP_BUCKET/1NEON" --exclude '*.map' --exclude index.html --exclude arrive.js \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp 1NEON/index.html "s3://$APP_BUCKET/1NEON/index.html" \
            --cache-control 'no-cache' --content-type 'text/html; charset=utf-8'
          aws s3 cp 1NEON/arrive.js "s3://$APP_BUCKET/1NEON/arrive.js" \
            --cache-control 'no-cache' --content-type 'text/javascript; charset=utf-8'

      # Drop cached app files so the new shell and assets show at once
      - name: Invalidate the CDN
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/1NEON/*' >/dev/null

      # Through neon1.tech: the API reports this commit, and the shell plus every asset it names loads.
      # Each curl is checked on its own, so a cut-off transfer fails the step
      - name: Verify
        run: |
          set -euo pipefail
          want="${GITHUB_SHA::7}"
          health=$(curl -fsS --retry 3 --retry-all-errors https://neon1.tech/1NEON/api/health)
          grep -q "\"version\":\"$want\"" <<<"$health" || { echo "::error::API reports $health, expected $want"; exit 1; }
          shell=$(curl -fsS --retry 3 --retry-all-errors -H 'cache-control: no-cache' https://neon1.tech/1NEON/)
          refs=$(grep -oE '/1NEON/(assets/[^"?]+|arrive\.js)' <<<"$shell" | sort -u)
          [ -n "$refs" ] || { echo "::error::the shell names no assets"; exit 1; }
          for ref in $refs; do
            curl -fsS -o /dev/null "https://neon1.tech$ref" || { echo "::error::$ref did not load"; exit 1; }
            echo "ok $ref"
          done

      # Old hashed assets are kept for 14 days for open tabs and rollback, then removed (none old is fine). Anything this
      # build still uses is never removed, however old
      - name: Prune old assets
        working-directory: apps/web/dist
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          aws s3api list-objects-v2 --bucket "$APP_BUCKET" --prefix 1NEON/assets/ \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text | tr '\t' '\n' | { grep -v '^None$' || true; } | while read -r key; do
              [ -z "$key" ] && continue
              [ -e "${key}" ] && continue
              aws s3 rm "s3://$APP_BUCKET/$key"
            done
