# .github/workflows/ci.yml - Check every push and pull request: types, tests, build, and Terraform.

name: ci

# Every branch push, plus pull requests into main
on:
  push:
  pull_request:
    branches: [main]

# Read-only token; CI never writes to the repo
permissions:
  contents: read

jobs:
  # Full history, so a secret in any commit fails the run. The image is pinned by digest
  secrets:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .

  # Typecheck, test, and build the TypeScript workspaces
  app:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-app
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 22, matching the Lambda runtime, with the npm cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # One version everywhere: the changelog's top entry and package.json agree
      - name: Check the release number
        run: |
          top=$(sed -n 's/^## v\([0-9][0-9.]*[0-9a-z.-]*\).*/\1/p' CHANGELOG.md | head -1)
          pkg=$(node -p "require('./package.json').version")
          [ "$top" = "$pkg" ] || { echo "::error::CHANGELOG.md says v$top but package.json says $pkg"; exit 1; }
          echo "release v$top"

      # Exact lockfile install, then typecheck, tests, and production builds of API and web
      - run: npm ci
      - run: npm run check

  # Terraform checks without touching AWS
  terraform:
    # A name no other workflow uses, so branch rules can require exactly this check
    name: ci-terraform
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Formatting and validation need no AWS access
      - run: terraform fmt -check -recursive -diff infra
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate -no-color
