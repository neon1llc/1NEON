# .github/workflows/ci.yml - Check every push and pull request: types, tests, build, and Terraform.

name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Exact lockfile install, then typecheck, tests, and production builds of API and web
      - run: npm ci
      - run: npm run check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Formatting and validation need no AWS access
      - run: terraform fmt -check -recursive -diff infra
      - run: terraform -chdir=infra/envs/prod init -backend=false -input=false
      - run: terraform -chdir=infra/envs/prod validate -no-color
