# .github/workflows/terraform.yml - Plan and apply production infrastructure from main.
# Off until the repository variable AWS_TERRAFORM_ROLE_ARN is set (see infra/README.md).

name: terraform

# Pushes to main that touch infrastructure, or a manual run
on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

# Read-only by default; the job adds the OIDC token it needs
permissions:
  contents: read

jobs:
  # Skipped until the Terraform role exists; id-token lets the job assume it
  prod:
    if: vars.AWS_TERRAFORM_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # One run at a time, and never cancel an apply halfway
    concurrency:
      group: terraform-prod
      cancel-in-progress: false

    # Every command runs in the production stack
    defaults:
      run:
        working-directory: infra/envs/prod

    steps:
      # Actions are pinned to commit SHAs; the checkout keeps no token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same Terraform version people use locally; no wrapper, so output stays plain
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      # Short-lived credentials through GitHub OIDC; the role trusts only this repo's main branch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1

      # Init against the S3 backend, then save the plan
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      # Apply exactly the plan above
      - run: terraform apply -input=false -no-color tfplan
