<!doctype html>
<!-- apps/web/index.html - The 1NEON app shell. CloudFront serves this for every app route under
     /1NEON/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="1NEON: the neon1 client project portal." />
    <title>1NEON · neon1</title>
    <!-- neon1's mark on a transparent ground, from neon1.tech: green to match the browser until the app
         sets the version for its own theme (Shell.tsx syncDark) -->
    <!-- Search results show one icon to everyone: neon1.tech's matrix green 192 px mark, listed first -->
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" vite-ignore />
    <link rel="icon" id="favicon" href="/favicon.svg" type="image/svg+xml" sizes="any" vite-ignore />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" vite-ignore />
    <!-- neon1.tech's shared design: fonts, brand tokens, rain layers, glass, and rain controls -->
    <link rel="stylesheet" href="/shared/neon1.css" vite-ignore />
    <!-- The site's "ask neon1" window, loaded in main.tsx -->
    <link rel="stylesheet" href="/shared/chat.css" vite-ignore />
    <!-- Arriving from neon1.tech: marks the page before its first paint so it stays black -->
    <script src="/arrive.js"></script>
    <!-- Figtree is used above the fold on every screen; the site serves it -->
    <link rel="preload" href="/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin vite-ignore />
  </head>
  <body>
    <!-- Plain fallbacks, replaced once the app renders: no JavaScript, or a bundle that didn't load -->
    <div id="root">
      <noscript><p>1NEON needs JavaScript. Turn it on and reload, or email <a href="mailto:hello@neon1.tech">hello@neon1.tech</a>.</p></noscript>
      <p id="boot-failed" hidden>1NEON didn't finish loading. <a href="/1NEON/">Reload</a>, or email <a href="mailto:hello@neon1.tech">hello@neon1.tech</a> if it keeps happening.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
